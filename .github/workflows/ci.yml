name: Part 2 Cybersecurity ML Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q src run_pipeline.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run complete ML pipeline
        run: python run_pipeline.py

      - name: Verify required runtime artifacts
        run: |
          test -f models/best_model.pkl
          test -f models/preprocessor.pkl
          test -f models/model_metadata.json
          test -f outputs/metrics.json
          test -f outputs/feature_importance.csv
          test -f outputs/model_comparison.csv
          test -f outputs/evaluation_report.json
          test -f outputs/evaluation_summary.json
          test -f outputs/prediction_results.csv
          test -f outputs/residual_report.csv
          test -f outputs/predictions.csv
          test -f outputs/prediction_summary.json
          test -s outputs/metrics.json
          test -s outputs/model_comparison.csv
          test -s outputs/feature_importance.csv
          test -s outputs/prediction_results.csv
          test -s outputs/residual_report.csv
          test -s outputs/predictions.csv

      - name: Upload ML audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-audit-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            outputs/metrics.json
            outputs/model_comparison.csv
            outputs/prediction_results.csv
            models/model_metadata.json
