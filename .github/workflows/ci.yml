name: Part 2 Cybersecurity ML Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q src scripts
      - name: Run tests
        run: python -m pytest -q
      - name: Run complete ML pipeline
        run: python -m src.run_pipeline
      - name: Run STEP 17 Feature Engineering + Ablation Study
        run: python -m src.feature_engineering
      - name: Run STEP 18 Hyperparameter Optimization
        run: python -m src.hyperparameter_optimization
      - name: Run STEP 19 Model Calibration + Threshold Optimization
        run: python scripts/run_step19.py
      - name: Run STEP 20 Model Explainability + Feature Importance
        run: python scripts/run_step20.py
      - name: Run STEP 21 Model Monitoring + Drift Detection
        run: python scripts/run_step21.py
      - name: Run STEP 22 Automated Retraining + Model Lifecycle
        run: python scripts/run_step22.py
      - name: Validate and execute EDA notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = Path("notebooks/EDA.ipynb")
          data = json.loads(notebook.read_text(encoding="utf-8"))
          assert data.get("nbformat") == 4
          assert isinstance(data.get("cells"), list) and data["cells"]
          print(f"EDA notebook JSON validation PASS: {len(data['cells'])} cells")
          PY
          jupyter nbconvert --to notebook --execute notebooks/EDA.ipynb --output EDA_executed.ipynb --output-dir notebooks --ExecutePreprocessor.timeout=600 --ExecutePreprocessor.kernel_name=python3
          test -s notebooks/EDA_executed.ipynb
      - name: Run and audit 29 SQL analytics queries
        run: python scripts/run_sql_queries.py
      - name: Verify required runtime artifacts
        run: |
          test -f models/best_model.pkl
          test -f models/preprocessor.pkl
          test -f models/model_metadata.json
          test -f models/feature_columns.pkl
          test -f outputs/feature_importance.csv
          test -f outputs/evaluation_report.json
          test -f outputs/metrics.json
          test -f outputs/model_comparison.csv
          test -f outputs/engineered_features.csv
          test -f outputs/ablation_results.csv
          test -f outputs/feature_engineering_report.json
          test -f outputs/hyperparameter_optimization.csv
          test -f outputs/hyperparameter_optimization_report.json
          test -f outputs/calibration_results.csv
          test -f outputs/threshold_optimization.csv
          test -f outputs/calibration_report.json
          test -f outputs/explainability_feature_importance.csv
          test -f outputs/local_prediction_explanation.csv
          test -f outputs/model_explainability_report.json
          test -f outputs/drift_results.csv
          test -f outputs/prediction_drift.json
          test -f outputs/drift_report.json
          test -f outputs/drift_summary.json
          test -f outputs/retraining_decision.json
          test -f outputs/model_lifecycle_comparison.csv
          test -f outputs/model_registry.json
          test -f outputs/sql_query_validation.csv
          test -f outputs/sql_query_validation.json
      - name: Upload dashboard-compatible ML artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: part2-runtime-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            models/best_model.pkl
            models/preprocessor.pkl
            models/feature_columns.pkl
            models/model_metadata.json
            outputs/feature_importance.csv
            outputs/evaluation_report.json
            outputs/metrics.json
            outputs/model_comparison.csv
            outputs/engineered_features.csv
            outputs/ablation_results.csv
            outputs/feature_engineering_report.json
            outputs/hyperparameter_optimization.csv
            outputs/hyperparameter_optimization_report.json
            outputs/calibration_results.csv
            outputs/threshold_optimization.csv
            outputs/calibration_report.json
            outputs/explainability_feature_importance.csv
            outputs/local_prediction_explanation.csv
            outputs/model_explainability_report.json
            outputs/drift_results.csv
            outputs/prediction_drift.json
            outputs/drift_report.json
            outputs/drift_summary.json
            outputs/retraining_decision.json
            outputs/model_lifecycle_comparison.csv
            outputs/model_registry.json
            outputs/sql_query_validation.csv
            outputs/sql_query_validation.json
      - name: Upload ML audit artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ml-audit-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            outputs/
            models/model_metadata.json
            notebooks/EDA_executed.ipynb
      - name: Build immutable Part 3 runtime bundle
        if: success()
        run: |
          set -euo pipefail
          rm -rf part3-runtime-bundle
          mkdir -p part3-runtime-bundle/models part3-runtime-bundle/outputs
          cp models/best_model.pkl models/preprocessor.pkl models/feature_columns.pkl part3-runtime-bundle/models/
          cp outputs/evaluation_report.json outputs/metrics.json outputs/feature_importance.csv part3-runtime-bundle/outputs/
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("part3-runtime-bundle")
          files = [
              "models/best_model.pkl",
              "models/preprocessor.pkl",
              "models/feature_columns.pkl",
              "outputs/evaluation_report.json",
              "outputs/metrics.json",
              "outputs/feature_importance.csv",
          ]
          manifest = {"source_repository": "pramodj551-oss/Part2-Cybersecurity-ML-Pipeline", "source_run_id": "${{ github.run_id }}", "artifact_name": "part2-runtime-artifacts", "files": {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in files}}
          (root / "artifact_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          cd part3-runtime-bundle
          zip -qr ../part2-runtime-bundle.zip .
      - name: Publish immutable runtime release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="part2-runtime-${{ github.run_id }}"
          gh release create "$tag" part2-runtime-bundle.zip --repo "${{ github.repository }}" --title "Part 2 runtime ${tag}" --notes "Immutable six-file runtime bundle for Part 3. Source workflow run: ${{ github.run_id }}."
          echo "Published immutable runtime release: $tag"