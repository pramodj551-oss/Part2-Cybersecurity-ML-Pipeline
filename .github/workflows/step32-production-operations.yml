name: STEP 32 Production Operations
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INFERENCE_API_KEY: ci-step32-operations-key
jobs:
  production-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Full regression
        run: python -m pytest -q
      - name: Security audit
        run: |
          test ! -f .env
          python -c "from pathlib import Path; assert not any('api_key="' in p.read_text(encoding='utf-8').lower() for p in Path('src').rglob('*.py')); print('Security PASS')"
      - name: Build artifacts
        run: python -m src.run_pipeline
      - name: Operations smoke
        run: |
          python -c "from src.production_operations import *; r=evaluate_slo({'availability':.999,'p95_latency_ms':120,'error_rate':.001}); assert r['healthy']; assert validate_canary({'error_rate':.01,'p95_latency_ms':100},{'error_rate':.01,'p95_latency_ms':105})['promote']; print('Operations PASS')"
