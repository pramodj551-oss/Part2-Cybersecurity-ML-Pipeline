# Release validation with mandatory API-key and rollback checks.
name: STEP 28 Release Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pramodj551-oss/cybersecurity-ml-pipeline
  RELEASE_VERSION: v1.1.0
  PREVIOUS_VERSION: v1.0.0

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Generate runtime model artifacts
        run: python run_pipeline.py
      - name: Validate release configuration
        run: |
          test -f Dockerfile
          test -f .dockerignore
          test -f .github/workflows/step27-cd.yml
          test -s models/best_model.pkl
          test -s models/preprocessor.pkl
          test -s models/model_metadata.json
      - name: Validate smoke secret is configured
        env:
          SMOKE_API_KEY: ${{ secrets.STEP28_SMOKE_API_KEY }}
        run: test -n "$SMOKE_API_KEY"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push v1.1.0 release image
        run: |
          docker build --pull \
            -t "${IMAGE_NAME}:${RELEASE_VERSION}" \
            -t "${IMAGE_NAME}:sha-${GITHUB_SHA::12}" .
          docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" >/dev/null
          docker push "${IMAGE_NAME}:${RELEASE_VERSION}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::12}"
      - name: Pull previous known-good release image
        run: docker pull "${IMAGE_NAME}:${PREVIOUS_VERSION}"
      - name: Validate previous release rollback image
        env:
          SMOKE_API_KEY: ${{ secrets.STEP28_SMOKE_API_KEY }}
        run: |
          docker run -d --name previous-release -p 8001:8000 \
            -e INFERENCE_API_KEY="$SMOKE_API_KEY" \
            "${IMAGE_NAME}:${PREVIOUS_VERSION}"
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8001/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/ready)" = "401"
          curl --fail --silent -H "X-API-Key: ${SMOKE_API_KEY}" http://127.0.0.1:8001/ready
          docker rm -f previous-release
      - name: Start v1.1.0 release candidate with mandatory API key
        env:
          SMOKE_API_KEY: ${{ secrets.STEP28_SMOKE_API_KEY }}
        run: |
          docker run -d --name release-candidate -p 8000:8000 \
            -e INFERENCE_API_KEY="$SMOKE_API_KEY" \
            "${IMAGE_NAME}:${RELEASE_VERSION}"
      - name: Deployment smoke tests
        env:
          SMOKE_API_KEY: ${{ secrets.STEP28_SMOKE_API_KEY }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/ready)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/metrics)" = "401"
          curl --fail --silent -H "X-API-Key: ${SMOKE_API_KEY}" http://127.0.0.1:8000/ready
          curl --fail --silent -H "X-API-Key: ${SMOKE_API_KEY}" http://127.0.0.1:8000/metrics >/dev/null
          curl --fail --silent -H "X-API-Key: ${SMOKE_API_KEY}" http://127.0.0.1:8000/model-info >/dev/null
      - name: Release image identity validation
        run: |
          docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" >/dev/null
          test "$(docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{.Config.User}}')" != "0"
      - name: Container security validation
        run: test "$(docker exec release-candidate id -u)" != "0"
      - name: Cleanup
        if: always()
        run: docker rm -f release-candidate previous-release 2>/dev/null || true
