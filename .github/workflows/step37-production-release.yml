name: STEP 37 Production Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/pramodj551-oss/cybersecurity-ml-pipeline
  RELEASE_VERSION: v1.1.0
  PREVIOUS_VERSION: v1.0.0

jobs:
  production-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release version is not already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_VERSION} already exists; refusing duplicate release."
            exit 1
          fi
          if git rev-parse "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_VERSION} already exists; refusing duplicate release."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run full regression and security tests
        run: python -m pytest -q

      - name: Generate and validate production artifacts
        run: |
          python run_pipeline.py
          test -s models/best_model.pkl
          test -s models/preprocessor.pkl
          test -s models/model_metadata.json

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push v1.1.0
        run: |
          docker build --pull -t "${IMAGE_NAME}:${RELEASE_VERSION}" -t "${IMAGE_NAME}:sha-${GITHUB_SHA::12}" .
          docker push "${IMAGE_NAME}:${RELEASE_VERSION}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::12}"

      - name: Pull previous known-good v1.0.0 image
        run: docker pull "${IMAGE_NAME}:${PREVIOUS_VERSION}"

      - name: Validate real rollback image
        env:
          SMOKE_API_KEY: ${{ secrets.STEP28_SMOKE_API_KEY }}
        run: |
          test -n "$SMOKE_API_KEY"
          docker run -d --name previous-release -p 8001:8000 -e INFERENCE_API_KEY="$SMOKE_API_KEY" "${IMAGE_NAME}:${PREVIOUS_VERSION}"
          for i in {1..30}; do
            if curl --silent http://127.0.0.1:8001/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8001/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/ready)" = "401"
          curl --fail --silent -H "X-API-Key: ${SMOKE_API_KEY}" http://127.0.0.1:8001/ready
          test "$(docker exec previous-release id -u)" != "0"
          docker rm -f previous-release

      - name: Start v1.1.0 production candidate
        env:
          SMOKE_API_KEY: ${{ secrets.STEP28_SMOKE_API_KEY }}
        run: |
          test -n "$SMOKE_API_KEY"
          docker run -d --name release-candidate -p 8000:8000 -e INFERENCE_API_KEY="$SMOKE_API_KEY" "${IMAGE_NAME}:${RELEASE_VERSION}"

      - name: Final production smoke test
        env:
          SMOKE_API_KEY: ${{ secrets.STEP28_SMOKE_API_KEY }}
        run: |
          for i in {1..30}; do
            if curl --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/ready)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/metrics)" = "401"
          curl --fail --silent -H "X-API-Key: ${SMOKE_API_KEY}" http://127.0.0.1:8000/ready
          curl --fail --silent -H "X-API-Key: ${SMOKE_API_KEY}" http://127.0.0.1:8000/metrics >/dev/null
          curl --fail --silent -H "X-API-Key: ${SMOKE_API_KEY}" http://127.0.0.1:8000/model-info >/dev/null
          test "$(docker exec release-candidate id -u)" != "0"

      - name: Create and push v1.1.0 Git tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
          git push origin "${RELEASE_VERSION}"

      - name: Create GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${RELEASE_VERSION}" --title "${RELEASE_VERSION}" --generate-notes

      - name: Cleanup
        if: always()
        run: docker rm -f release-candidate previous-release 2>/dev/null || true
