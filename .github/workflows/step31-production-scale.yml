name: STEP 31 Production Scale Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INFERENCE_API_KEY: ci-step31-smoke-secret

jobs:
  production-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Security and secrets audit
        run: |
          test ! -f .env
          grep -q '^INFERENCE_API_KEY=' .env.example
          ! grep -R --exclude-dir=.git -E 'INFERENCE_API_KEY=[^$]' .github src tests
      - name: Full regression tests
        run: python -m pytest -q
      - name: Build runtime artifacts
        run: python -m src.run_pipeline
      - name: Docker production-equivalent environment
        run: |
          docker compose -f docker-compose.production.yml config
          INFERENCE_API_KEY="$INFERENCE_API_KEY" docker compose -f docker-compose.production.yml up -d --build
      - name: Redis connectivity
        run: INFERENCE_API_KEY="$INFERENCE_API_KEY" docker compose -f docker-compose.production.yml exec -T redis redis-cli ping | grep PONG
      - name: Deployment smoke tests
        run: python scripts/smoke_step31.py
      - name: Shutdown
        if: always()
        run: INFERENCE_API_KEY="$INFERENCE_API_KEY" docker compose -f docker-compose.production.yml down -v
