name: STEP 33 Advanced Governance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INFERENCE_API_KEY: ci-step33-governance-key
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Full regression
        run: python -m pytest -q
      - name: Security validation
        run: |
          test ! -f .env
          python - <<'PY'
          from pathlib import Path
          forbidden = ("BEGIN PRIVATE KEY", "password=", "secret=", "api_key=\"")
          hits=[]
          for root in ("src", "tests"):
              for p in Path(root).rglob("*.py"):
                  text=p.read_text(encoding="utf-8").lower()
                  if any(x.lower() in text for x in forbidden): hits.append(str(p))
          assert not hits, "Potential hardcoded secret: " + ", ".join(hits)
          print("Security PASS")
          PY
      - name: Governance policy validation
        run: |
          python - <<'PY'
          from src.governance import evaluate_promotion
          good=evaluate_promotion(model_version="ci",status="candidate",tests_passed=True,security_passed=True,drift_ok=True,canary_ok=True)
          bad=evaluate_promotion(model_version="ci",status="candidate",tests_passed=True,security_passed=False,drift_ok=True,canary_ok=True)
          assert good.decision == "promote"
          assert bad.decision == "reject"
          print("Governance PASS")
          PY
      - name: Docker validation
        run: |
          test -f Dockerfile
          docker build -t cybersecurity-ml-pipeline:step33 .
      - name: Policy artifact
        run: |
          mkdir -p outputs/governance
          printf '%s\n' '{"step":33,"policy":"step33-v1","status":"validated"}' > outputs/governance/policy_validation.json
